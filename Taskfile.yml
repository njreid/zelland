version: "3"

vars:
  ADB: "$HOME/Android/Sdk/platform-tools/adb"
  APKSIGNER: "$HOME/Android/Sdk/build-tools/36.1.0/apksigner"
  ADDR: 10.2.1.225
  DEVICE: nicphpne

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  dev:
    desc: "Run the app in development mode (Desktop)"
    cmds:
      - pgrep zlnd > /dev/null || timeout 3 zellij action new-pane -- fish -c "task dev:daemon" 2>/dev/null || nohup bash -c "cd daemon-rs && cargo run --bin zlnd" > /tmp/zlnd.log 2>&1 &
      - WEBKIT_DISABLE_DMABUF_RENDERER=1 npm run tauri dev

  "dev:daemon":
    desc: "Run the zelland daemon"
    dir: daemon-rs
    cmds:
      - cargo run --bin zlnd

  "dev:android":
    desc: "Run the app in development mode (Android)"
    cmds:
      - npm run tauri android dev

  "build:daemon":
    desc: "Build the daemon and CLI"
    dir: daemon-rs
    cmds:
      - mkdir -p ../build
      - cargo build --release
      - cp target/release/zlnd ../build/zlnd
      - cp target/release/zn ../build/zn

  "build:bin":
    desc: "Build the app binary only (no AppImage/deb/rpm bundles)"
    cmds:
      - npm run tauri build -- --no-bundle
      - task: "build:daemon"

  "build:linux":
    desc: "Build the app for Linux (Production, includes AppImage/deb/rpm bundles)"
    cmds:
      - npm run tauri build
      - task: "build:daemon"

  "build:android":
    desc: "Build the app for Android (Production APK)"
    sources:
      - src/**/*
      - static/**/*
      - src-tauri/src/**/*
      - src-tauri/Cargo.*
      - src-tauri/tauri.conf.json
      - src-tauri/build.rs
      - src-tauri/binaries/**/*
      - package.json
      - package-lock.json
      - svelte.config.js
      - vite.config.js
      - tsconfig.json
    generates:
      - src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    cmds:
      - npm run tauri android build

  "build":
    desc: "Build for all platforms (Linux + Android)"
    cmds:
      - task: "build:linux"
      - task: "build:android"

  "clean":
    desc: "Clean build artifacts"
    cmds:
      - rm -rf src-tauri/target
      - rm -rf src-tauri/gen/android/app/build/outputs/apk
      - rm -rf build
      - echo "✓ Build artifacts cleaned"

  "clean:all":
    desc: "Deep clean (artifacts + node_modules)"
    cmds:
      - task: "clean"
      - rm -rf node_modules
      - echo "✓ All dependencies and artifacts cleaned"

  "icon":
    desc: "Generate app icons from zelland_icon.png"
    cmds:
      - npm run tauri icon zelland_icon.png

  "dev:voice":
    desc: "Run Voice Terminal in development mode"
    dir: src-voice
    cmds:
      - WEBKIT_DISABLE_DMABUF_RENDERER=1 RUST_LOG=debug npm run tauri dev 2>&1 | tee ../voice_dev_output.log

  "build:voice":
    desc: "Build Voice Terminal for Linux"
    dir: src-voice
    cmds:
      - npm run tauri build

  "test:voice":
    desc: "Run Voice Terminal tests"
    dir: src-voice/src-tauri
    cmds:
      - cargo test

  "test":
    desc: "Run tests"
    cmds:
      - npm run test
      - cd src-tauri && cargo test
      - cd daemon-rs && cargo test
      - cd src-voice/src-tauri && cargo test

  "connect:android":
    desc: "Connect to Android device wirelessly (usage: task connect:android ADDR=192.168.1.5:PORT)"
    cmds:
      - "{{.ADB}} connect {{.ADDR}}"

  "push:android":
    desc: "Build and push APK to connected device"
    vars:
      APK_PATH: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    cmds:
      - task: "build:android"
      - "{{.APKSIGNER}} sign --ks my-release-key.keystore --ks-pass pass:password --key-pass pass:password {{.APK_PATH}}"
      - "{{.ADB}} install -r {{.APK_PATH}}"
      - echo "✓ APK pushed and installed"

  "push:device":
    desc: "Build, sign, and push APK to a named Android device (usage: task push:device DEVICE=hostname)"
    vars:
      APK_PATH: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    cmds:
      - task: "build:android"
      - "{{.APKSIGNER}} sign --ks my-release-key.keystore --ks-pass pass:password --key-pass pass:password {{.APK_PATH}}"
      - "{{.ADB}} connect {{.DEVICE}}"
      - "{{.ADB}} -s {{.DEVICE}} install -r {{.APK_PATH}}"
      - echo "✓ APK pushed and installed on {{.DEVICE}}"

  "push:emu":
    desc: "Start emulator (if not running) and push APK"
    cmds:
      - ./scripts/push_emu.sh
      - task: "push:android"

  "install":
    desc: "Build and install zelland, zn, and zlnd to ~/bin; install hook scripts; configure Claude Code + Gemini CLI hooks; create/update zlnd systemd user service"
    cmds:
      - task: "build:bin"
      - mkdir -p ~/bin
      - cp build/zn ~/bin/zn
      - cp build/zlnd ~/bin/zlnd
      - cp src-tauri/target/release/zelland ~/bin/zelland
      - chmod +x ~/bin/zn ~/bin/zlnd ~/bin/zelland
      - echo "✓ Binaries installed to ~/bin"
      - cp scripts/zelland-agent-notify ~/bin/zelland-agent-notify
      - cp scripts/zelland-ask-notify ~/bin/zelland-ask-notify
      - chmod +x ~/bin/zelland-agent-notify ~/bin/zelland-ask-notify
      - echo "✓ Hook scripts installed to ~/bin"
      - |
        # --- Claude Code hooks (~/.claude/settings.json) ---
        CLAUDE_CFG="$HOME/.claude/settings.json"
        mkdir -p "$(dirname "$CLAUDE_CFG")"
        [ -f "$CLAUDE_CFG" ] || echo '{}' > "$CLAUDE_CFG"
        UPDATED=$(jq '
          .hooks.Stop = (
            (.hooks.Stop // [])
            | map(select(
                (.command == "zelland-agent-notify claude_code") or
                ((.hooks // []) | map(.command) | contains(["zelland-agent-notify claude_code"]))
                | not
              ))
            | . + [{"hooks":[{"type":"command","command":"zelland-agent-notify claude_code"}]}]
          )
          | .hooks.PostToolUse = (
            (.hooks.PostToolUse // [])
            | map(select(
                (.command == "zelland-ask-notify") or
                ((.hooks // []) | map(.command) | contains(["zelland-ask-notify"]))
                | not
              ))
            | . + [{"matcher":"AskUserQuestion","hooks":[{"type":"command","command":"zelland-ask-notify"}]}]
          )
        ' "$CLAUDE_CFG")
        printf '%s\n' "$UPDATED" > "$CLAUDE_CFG"
        echo "✓ Claude Code hooks configured in $CLAUDE_CFG"
      - |
        # --- Gemini CLI hooks (~/.gemini/settings.json) ---
        GEMINI_CFG="$HOME/.gemini/settings.json"
        mkdir -p "$(dirname "$GEMINI_CFG")"
        [ -f "$GEMINI_CFG" ] || echo '{}' > "$GEMINI_CFG"
        UPDATED=$(jq '
          .hooks.AfterAgent = (
            (.hooks.AfterAgent // [])
            | map(select(
                (.hooks // []) | map(.command) | contains(["zelland-agent-notify gemini_cli"]) | not
              ))
            | . + [{"hooks":[{"name":"zelland-notify","type":"command","command":"zelland-agent-notify gemini_cli"}]}]
          )
        ' "$GEMINI_CFG")
        printf '%s\n' "$UPDATED" > "$GEMINI_CFG"
        echo "✓ Gemini CLI hooks configured in $GEMINI_CFG"
      - |
        SERVICE_FILE="$HOME/.config/systemd/user/zlnd.service"
        mkdir -p "$(dirname "$SERVICE_FILE")"
        if systemctl --user cat zlnd.service > /dev/null 2>&1; then
          systemctl --user restart zlnd.service
          echo "✓ zlnd service restarted with updated binary"
        else
          {
            echo '[Unit]'
            echo 'Description=zelland daemon (zlnd)'
            echo 'After=network.target'
            echo ''
            echo '[Service]'
            echo 'ExecStart=%h/bin/zlnd'
            echo 'Restart=on-failure'
            echo 'RestartSec=5'
            echo ''
            echo '[Install]'
            echo 'WantedBy=default.target'
          } > "$SERVICE_FILE"
          systemctl --user daemon-reload
          systemctl --user enable zlnd.service
          systemctl --user start zlnd.service
          echo "✓ zlnd service installed and started"
        fi
