[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
prost-build = "0.14.3"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.57.0"
tokio = { version = "1.49.0", features = ["full"] }
prost = "0.14.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-store = "2.4.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-process = "2.3.1"
# Added 'connect' and 'handshake' features to resolve connect_async import
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["rustls", "rustls-pki-types", "connect", "handshake"] }
futures-util = "0.3.31"
tauri-plugin-haptics = "2.3.2"
russh-keys = "0.49.2"
async-trait = "0.1"
gotatun = { version = "0.2.0", features = ["device", "tun"] }
anyhow = "1.0"
bytes = "1.9"
base64 = "0.22"
ipnetwork = "0.21"
# Added rustls-tls feature
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-os = "2.2"
tauri-plugin-log = "2"
log = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jni = "0.21"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core", "encryption"] }
ed25519-dalek = { version = "2", features = ["std"] }
rand = "0.8"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.1"
gtk = "0.18.1"
glib = "0.18"

# Fallback: if any dependency still forces OpenSSL, try to vendor it
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
