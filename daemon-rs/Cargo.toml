[package]
name = "zelland-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zellandd"
path = "src/main.rs"

[[bin]]
name = "zelland"
path = "src/cli.rs"

[lib]
name = "zelland_daemon"
path = "src/lib.rs"

[build-dependencies]
prost-build = "0.14.3"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
prost = "0.14.3"
kdl = "6"
notify = "8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
futures-util = "0.3"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.28"
