[package]
name = "voice-terminal"
version = "0.1.0"
description = "Voice-driven terminal with Moonshine speech-to-text"
edition = "2021"

[lib]
name = "voice_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.9"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"

# Speech engine deps
ort = { version = "2.0.0-rc.11", features = ["load-dynamic"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
cpal = "0.15"
rubato = "0.14"

[dev-dependencies]
tempfile = "3"
hound = "3.5"
